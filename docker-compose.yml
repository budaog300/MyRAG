services:

  postgres:
    image: postgres:17
    env_file:
      - ./env/.env.backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - ./env/.env.backend
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    env_file:
      - ./env/.env.backend
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    env_file:
      - ./env/.env.backend
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - ./env/.env.backend
    restart: unless-stopped

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "alembic", "upgrade", "head" ]
    env_file:
      - ./env/.env.backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rag_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "python", "-m", "src.main" ]
    env_file:
      - ./env/.env.backend
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  rag_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "python", "-m", "src.worker" ]
    env_file:
      - ./env/.env.backend
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  rag_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./env/.env.frontend
    ports:
      - "80:80"
    depends_on:
      - rag_backend
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
  qdrant_data:
