services:

  postgres:
    image: postgres:17
    env_file:
      - ./env/.env
      - ./env/.env.secrets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    env_file:
      - ./env/.env
      - ./env/.env.secrets
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env
      - ./env/.env.secrets
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "alembic", "upgrade", "head" ]
    env_file:
      - ./env/.env
      - ./env/.env.secrets
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rag_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    env_file:
      - ./env/.env
      - ./env/.env.secrets
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  rag_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: [ "watchfiles", "python -m src.worker", "/app/src" ]
    env_file:
      - ./env/.env
      - ./env/.env.secrets
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  rag_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./env/.env
      - ./env/.env.secrets
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - rag_backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    tty: true
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  infinity_embeddings:
    image: michaelf34/infinity:latest
    command: [ "v2", "--model-id", "BAAI/bge-m3", "--port", "7997" ]
    volumes:
      - infinity_embeddings_data:/app/.cache
    ports:
      - "7997:7997"
    gpus: all
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:7997/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  infinity_reranker:
    image: michaelf34/infinity:latest
    command: [ "v2", "--model-id", "BAAI/bge-reranker-v2-m3", "--port", "7998" ]
    volumes:
      - infinity_reranker_data:/app/.cache
    ports:
      - "7998:7998"
    gpus: all
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:7998/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
  qdrant_data:
  frontend_node_modules:
  ollama_data:
  infinity_embeddings_data:
  infinity_reranker_data:
